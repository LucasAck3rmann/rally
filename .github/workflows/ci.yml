name: CI
on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sem `version` aqui: a partir do action-setup v6, declarar a versão nos
      # dois lugares é erro. A fonte única é `packageManager` no package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A web rodava 175 testes sem nunca medir cobertura, enquanto a API mede
      # desde setembro. O piso está no `vitest.config.mts` e vale só com
      # `--coverage`, então sem este passo ele não trava nada.
      - run: pnpm --filter @rally/web test:cov
      - run: pnpm build

  mobile:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      # Versão fixa, como o Node 22 do job acima: CI e máquina de
      # desenvolvimento compilam o app com o mesmo SDK.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.5, channel: stable, cache: true }
      - run: flutter pub get
      # O formatador do Dart mudou para o "tall style" no 3.7; o gate garante
      # que a base não volte a divergir dele.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # `--coverage` em vez de `flutter test` seco: o app tinha 206 testes e
      # nenhuma medida, de modo que ninguém sabia se cobriam 40% ou 90%.
      - run: flutter test --coverage
      # O piso é de **linha**, porque é só isso que o lcov do Flutter traz —
      # não há ramo nem função ali. A assimetria que a API expõe é invisível
      # aqui, e não por estar resolvida.
      - run: dart run tool/cobertura.dart

  banco:
    name: Migrações e concorrência
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U rally"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://rally:rally@localhost:5432/rally
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Rodar as migrações num banco limpo é o que valida o SQL escrito à mão
      # da exclusion constraint — sem isto, um erro nela só apareceria no deploy.
      - run: pnpm --filter @rally/api exec prisma migrate deploy
      - run: pnpm --filter @rally/api exec prisma db seed
      # Com DATABASE_URL definida, a suíte inclui os testes de integração que
      # provam a trava contra overbooking (RN-01), inclusive sob corrida.
      #
      # A cobertura (RNF-13) é medida aqui, e não no job sem banco, porque é
      # aqui que a suíte roda inteira: `criar()` só é exercitado pelos testes
      # de integração, e medir sem eles produziria um número mais baixo que o
      # real. O piso está no `coverageThreshold` do jest.config.js.
      - run: pnpm --filter @rally/api test:cov

  telas:
    name: As telas do painel abrem
    runs-on: ubuntu-latest
    # Existe porque seis telas do painel estiveram quebradas na `main` com a
    # suite inteira verde. Elas falhavam no runtime do Next -- Server
    # Component passando funcao a Client Component --, e teste de unidade nao
    # alcanca isso: ele monta o componente no jsdom, onde a fronteira entre
    # servidor e cliente nao existe. O unico jeito de saber se uma tela abre e
    # abrindo.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U rally"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://rally:rally@localhost:5432/rally
      API_URL: http://localhost:3333/api/v1
      API_PUBLIC_URL: http://localhost:3333
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Segredo de execucao efemera: o processo morre com o job e nada
      # assinado aqui vale fora dele.
      JWT_ACCESS_SECRET: ci-efemero-nao-vale-fora-deste-job
      JWT_REFRESH_SECRET: ci-efemero-nao-vale-fora-deste-job
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rally/api exec prisma migrate deploy
      # O seed e o que da conteudo as telas: sem reserva, sem serie e sem
      # trilha, o painel abre vazio e o portao nao exercita o que importa.
      - run: pnpm --filter @rally/api exec prisma db seed
      - run: pnpm build
      - name: Sobe a API e a web
        run: |
          pnpm --filter @rally/api start &
          pnpm --filter @rally/web start &
      # O navegador vem do Playwright, na versao que o package.json fixa.
      - run: pnpm exec playwright install --with-deps chromium
      # `--sem-salvar` percorre as mesmas telas da captura e cobra o titulo de
      # cada uma, sem escrever imagem. A lista de telas e uma so, de proposito:
      # duas listas divergiriam, e a que nao fosse exercitada quebraria calada.
      - run: node tools/capturas.mjs --sem-salvar

  licenca:
    name: Declaração de licença
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `reuse lint` cobra declaração de licença em TODO arquivo rastreado:
      # cabeçalho SPDX no código, REUSE.toml para o resto. Falha o build quando
      # entra arquivo sem declaração — é o gate da seção 4 de
      # docs/codigo-aberto.md. Versão fixada na que foi verificada localmente.
      # O extra charset-normalizer evita depender do libmagic do runner.
      - run: pipx install "reuse[charset-normalizer]==6.2.0"
      - run: reuse lint

  security:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t rally-api .
      - run: docker build -f apps/web/Dockerfile -t rally-web .
  # deploy: push no ECR + update do serviço ECS (no merge em main) — ver docs/adr/0010
