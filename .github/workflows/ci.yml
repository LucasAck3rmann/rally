name: CI
on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sem `version` aqui: a partir do action-setup v6, declarar a versão nos
      # dois lugares é erro. A fonte única é `packageManager` no package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mobile:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      # Versão fixa, como o Node 22 do job acima: CI e máquina de
      # desenvolvimento compilam o app com o mesmo SDK.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.5, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  security:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t rally-api .
      - run: docker build -f apps/web/Dockerfile -t rally-web .
  # deploy: push no ECR + update do serviço ECS (no merge em main) — ver docs/adr/0010
