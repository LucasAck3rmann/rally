name: CI
on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sem `version` aqui: a partir do action-setup v6, declarar a versão nos
      # dois lugares é erro. A fonte única é `packageManager` no package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mobile:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      # Versão fixa, como o Node 22 do job acima: CI e máquina de
      # desenvolvimento compilam o app com o mesmo SDK.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.5, channel: stable, cache: true }
      - run: flutter pub get
      # O formatador do Dart mudou para o "tall style" no 3.7; o gate garante
      # que a base não volte a divergir dele.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  banco:
    name: Migrações e concorrência
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U rally"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://rally:rally@localhost:5432/rally
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Rodar as migrações num banco limpo é o que valida o SQL escrito à mão
      # da exclusion constraint — sem isto, um erro nela só apareceria no deploy.
      - run: pnpm --filter @rally/api exec prisma migrate deploy
      - run: pnpm --filter @rally/api exec prisma db seed
      # Com DATABASE_URL definida, a suíte inclui os testes de integração que
      # provam a trava contra overbooking (RN-01), inclusive sob corrida.
      - run: pnpm --filter @rally/api test

  security:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t rally-api .
      - run: docker build -f apps/web/Dockerfile -t rally-web .
  # deploy: push no ECR + update do serviço ECS (no merge em main) — ver docs/adr/0010
